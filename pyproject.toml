[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rakiura"
version = "0.2.0"
description = "Log your progress on Rakiura steps from a Jupyter notebook."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Rakiura Inc." }]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Framework :: Jupyter",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Rakiura-Inc/rakiura-py"
Source = "https://github.com/Rakiura-Inc/rakiura-py"

[project.optional-dependencies]
requests = ["requests>=2.25"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["rakiura*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
